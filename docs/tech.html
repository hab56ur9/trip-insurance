<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip Insurance PoC Tech Doc</title>
</head>
<body>
<div id="app"></div>

        h("p", null, "Mock 서버를 쓰는 이유는 PoC가 확인하려는 것이 컨트랙트의 규칙이기 때문이다. 실제 발급사와 오라클은 연동하기 어렵고, 시연에서 결과를 마음대로 고를 수 없다. Mock 서버는 실제와 같은 형태의 NFT와 서명된 관측값을 만들므로, 나중에 실제 서비스로 바꿔도 컨트랙트는 그대로 둔다."),
        h(DataTable, {
          fit: true,
          columns: [{ label: "구성 요소", width: "10rem" }, { label: "맡는 일", wrap: true }],
          rows: [

            ["비용 NFT", "예약과 결제 금액을 담고, 누가 그 예약을 가졌는지 알려 준다"],
            ["서명 검증", "관측값에 서명한 오라클이 보장 조건의 오라클인지 확인한다"],
            ["발급사 서버", "실제 예약 발급사를 대신해 구매자에게 비용 NFT를 발급한다"],
            ["오라클 서버", "발표자가 정한 결과를 관측값으로 만들어 서명하고 컨트랙트에 보낸다"],
          ],

      ),
      h(DocSection, { title: "구성 방식" },

        h(DataTable, {
          fit: true,
          columns: [{ label: "Mock 서버", width: "10rem" }, { label: "실제로 필요한 것", wrap: true }, { label: "Mock으로 대신하는 이유", wrap: true }],
          rows: [
            ["발급사 서버", "KTX · 숙소 예약사가 예약을 NFT로 발급", "예약을 NFT로 발급하는 실제 예약사가 없다"],
            ["오라클 서버", "코레일 · 기상청 데이터를 서명해 주는 오라클 서비스", "실제 오라클은 비용과 연동 절차가 필요하고, 시연에서 정상 · 지연을 고를 수 없다"],
          ],
        }),
        choice([
          ["컨트랙트 하나가 모든 보험을 관리", true, ["배포가 한 번이고 조회가 한곳에 모인다", "보험마다 드는 배포 가스비가 없다"], ["컨트랙트 하나의 결함이 모든 보험에 영향을 준다"]],

        ]),
        limits([
          ["시간", "블록체인은 정해진 시각에 스스로 실행되지 않는다", "판정 · 청구 트랜잭션이 들어올 때 지난 시각의 상태 전환을 먼저 실행하고, 화면은 조회만으로 현재 상태를 계산한다"],
          ["오라클 신뢰", "판정은 오라클이 서명한 값만큼만 정확하다", "PoC는 Mock 서버로 대신하고, 실제로는 공신력 있는 데이터 제공자로 바꾼다"],

        h(Figure, { caption: "컨트랙트가 NFT 소유를 확인한 뒤 보험을 기록하고 입찰을 연다" }, joinFlow),
        handled("G", [
          ["가입하려면 그 예약의 비용 NFT를 갖고 있어야 한다.", "컨트랙트가 비용 NFT의 현재 소유자를 조회해 가입자와 다르면 거절한다."],

        ]),
        limits([
