<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 여행 보험</title>
<link rel="stylesheet" href="../app.css?v=20261122e">
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<script src="../shared.js?v=20261122e"></script>
</head>
<body>
<main>
  <div class="top">
    <div class="row" style="gap: 4px;"><button class="back" id="back" hidden aria-label="뒤로">‹</button><h1 id="heading">내 여행 보험</h1></div>
    <span class="pill"><span class="dot" id="dot"></span>
      <select id="walletMode" aria-label="지갑">
        <option value="4">구매자 #4</option>
        <option value="temp">내 임시 지갑</option>
        <option value="presenter">시연자</option>
      </select>
    </span>
  </div>
  <nav class="nav" id="nav"><a class="on" href="./">보험</a><a href="../">투자</a></nav>

  <section data-view="home">
    <div class="hero" id="hero" hidden>
      <div class="label">받을 수 있는 금액</div>
      <div class="big" id="credits">—</div>
    </div>
    <div class="card" id="gas" hidden><div class="row"><span><span class="title">가스비가 부족해요</span><div class="meta">테스트 ETH를 한 번 받을 수 있어요.</div></span><button class="btn sm" id="gasBtn">받기</button></div></div>
    <div class="section">
      <h2>내 여행 <button class="btn sm ghost" id="addBtn" hidden>예약 불러오기</button></h2>
      <div id="trips"><div class="empty">불러오는 중…</div></div>
    </div>
    <div class="cta"><div class="inner"><button class="btn" id="mainBtn">내 예약 불러오기</button></div></div>
  </section>

  <section data-view="join" hidden>
    <div class="hero">
      <div class="label"><span id="joinBooking"></span> · 일정이 틀어지면 받는 금액</div>
      <div class="big" id="joinCoverage"></div>
      <div class="kv"><span class="k">지금 내는 보험료</span><span class="v" id="joinPremium" style="font-size: 20px;"></span></div>
      <div class="sub" id="joinCondition"></div>
    </div>
    <div class="order">
      <div class="order-row">
        <span class="k">최소 보장금액<small>투자자가 더 높게 부를 수 있어요</small></span>
        <span class="stepper"><button type="button" data-step="minCoverage:-100" aria-label="100원 내리기">−</button><input id="minCoverage" inputmode="numeric" aria-label="최소 보장금액"><span class="unit">원</span><button type="button" data-step="minCoverage:100" aria-label="100원 올리기">+</button></span>
      </div>
      <div class="order-row">
        <span class="k">보험료<small>일정이 무사하면 투자자의 수익이 돼요</small></span>
        <span class="stepper"><button type="button" data-step="premium:-10" aria-label="10원 내리기">−</button><input id="premium" inputmode="numeric" aria-label="보험료"><span class="unit">원</span><button type="button" data-step="premium:10" aria-label="10원 올리기">+</button></span>
      </div>
      <div class="order-row">
        <span class="k">투자자 모집 시간<small id="minutesHint"></small></span>
        <span class="stepper"><button type="button" data-step="minutes:-1" aria-label="1분 줄이기">−</button><input id="minutes" inputmode="numeric" aria-label="모집 시간"><span class="unit">분</span><button type="button" data-step="minutes:1" aria-label="1분 늘리기">+</button></span>
      </div>
    </div>
    <div class="cta"><div class="inner"><button class="btn" id="doJoin">가입하기</button></div></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
(async () => {
  const ctx = await setup();
  let joining = null;
  let loaded = false;

  const show = createViews({ home: "내 여행 보험", join: "보험 가입" });
  const back = () => history.back();

  const myBookings = () => ctx.bookingsOf(ctx.address);

  function joinSheet(entry, now) {
    const item = ctx.caseOf(entry.booking.subject);
    joining = entry;
    $("joinBooking").textContent = item?.title || "보험";
    $("joinCondition").textContent = conditionText(item).replace("이면 지급", "이면 받아요");
    $("premium").value = won(weiToKrw(ethers.parseEther(item?.premiumEth || "0.00003")));
    $("minCoverage").value = won(weiToKrw(ethers.parseEther(item?.minCoverageEth || "0.0006")));
    showPremiumEth();
    const maxMinutes = Math.floor((Number(entry.booking.start) - now - ctx.config.minGap - 30) / 60);
    $("minutes").value = Math.max(1, maxMinutes);
    $("minutesHint").textContent = `출발 전 최대 ${maxMinutes}분`;
    joining.maxMinutes = maxMinutes;
    show("join");
  }

  const digits = (v) => Number(String(v).replace(/[^0-9]/g, "")) || 0;
  const wonWithEth = (value) => {
    let wei = 0n;
    try { wei = krwToWei(value); } catch {}
    return money(wei);
  };
  function showPremiumEth() {
    $("joinCoverage").innerHTML = wonWithEth($("minCoverage").value).replace("원</span>", "원 이상</span>");
    $("joinPremium").innerHTML = wonWithEth($("premium").value);
  }
  $("premium").oninput = showPremiumEth;
  $("minCoverage").oninput = showPremiumEth;
  document.querySelectorAll("[data-step]").forEach((el) => (el.onclick = () => {
    const [field, delta] = el.dataset.step.split(":");
    let next = Math.max(field === "minutes" ? 1 : 0, digits($(field).value) + Number(delta));
    if (field === "minutes") next = Math.min(joining?.maxMinutes || next, next);
    $(field).value = field === "minutes" ? String(next) : won(next);
    showPremiumEth();
  }));

  $("doJoin").onclick = async () => {
    const item = ctx.caseOf(joining.booking.subject);
    const biddingEnd = (await ctx.now()) + digits($("minutes").value) * 60;
    const condition = { oracle: ctx.config.oracle, kind: item.kindId, comparison: 0, threshold: item.threshold };
    $("doJoin").disabled = true;
    const ok = await ctx.send("보험 가입", () =>
      ctx.write.requestPolicy(joining.tokenId, condition, krwToWei($("minCoverage").value), biddingEnd, { value: krwToWei($("premium").value) })
    );
    $("doJoin").disabled = false;
    if (ok) { back(); ctx.refresh(); }
  };

  function outcome(p) {
    if (p.stored >= 2) return { sold: Number(p.policy.soldUnits), coverage: p.policy.coverage };
    const filled = allocation(p.bids);
    return {
      sold: filled.reduce((a, b) => a + b, 0),
      coverage: filled.reduce((a, f, i) => a + BigInt(f) * p.bids[i].unitCoverage, 0n),
    };
  }

  function closeButton(p) {
    if (p.status !== 1 || p.bids.length === 0) return "";
    return `<button class="btn sm" data-close="${p.id}">지금 체결하기</button>`;
  }

  function refundButton(p) {
    const refund = p.status === 3 || p.status === 6 || (p.status === 2 && outcome(p).sold < 100);
    if (!refund) return "";
    if (p.stored === 1) return `<button class="btn sm" data-bind="${p.id}">보험료 돌려받기</button>`;
    if (p.stored === 2 && p.status === 6) return `<button class="btn sm" data-void="${p.id}">보험료 돌려받기</button>`;
    return "";
  }

  function tripCard(entry, policy, now) {
    const item = ctx.caseOf(entry.booking.subject);
    const name = esc(item?.booking || `예약 #${entry.tokenId}`);
    if (!policy) {
      const open = Number(entry.booking.start) - now > ctx.config.minGap + 60;
      const action = open ? `<button class="btn sm" data-join="${entry.tokenId}">보험 들기</button>` : `<span class="chip gray">가입 마감</span>`;
      return `<div class="card"><div class="row"><span><span class="title">${name}</span><div class="meta">출발 ${when(entry.booking.start)}</div></span>${action}</div></div>`;
    }
    const lines = {
      1: `보장금액 최소 ${krw(policy.policy.minCoverage)} · 투자자 모집 ${left(policy.policy.biddingEnd, now)}`,
      2: `보장금액 ${krw(outcome(policy).coverage)} · 여행이 끝나면 판정해요`,
      3: "투자자가 없어 보험료를 돌려받아요",
      4: `일정이 틀어져 보장금 ${krw(policy.policy.coverage)}을 받았어요`,
      5: "일정이 무사히 끝났어요",
      6: "판정이 없어 보험료를 돌려받아요",
    };
    return `<div class="card"><div class="row"><span class="title">${name}</span>${statusChip(policy.status)}</div>
      <div class="row"><span class="meta">${lines[policy.status]}</span>${closeButton(policy) || refundButton(policy)}</div></div>`;
  }

  ctx.refresh = async () => {
    const now = await ctx.now();
    const [credits, bookings, all] = await Promise.all([ctx.read.credits(ctx.address), myBookings(), ctx.policies()]);
    await ctx.gasBanner();
    $("hero").hidden = credits === 0n;
    $("credits").innerHTML = money(credits);
    $("mainBtn").textContent = credits > 0n ? "출금하기" : "내 예약 불러오기";
    $("mainBtn").dataset.mode = credits > 0n ? "withdraw" : "book";
    showImport();
    $("addBtn").hidden = credits === 0n;

    const byToken = new Map(all.filter((p) => p.policy.insured === ctx.address).map((p) => [Number(p.policy.tokenId), p]));
    const shown = bookings.filter((b) => byToken.has(b.tokenId) || Number(b.booking.start) - now > ctx.config.minGap + 60);
    $("trips").innerHTML = loaded && shown.length
      ? shown.slice().reverse().map((b) => tripCard(b, byToken.get(b.tokenId), now)).join("")
      : `<div class="empty">예약 앱에서 내 예약을 불러와 보험을 들어요.</div>`;
    document.querySelectorAll("[data-join]").forEach((el) => (el.onclick = () => joinSheet(bookings.find((b) => b.tokenId === Number(el.dataset.join)), now)));
    document.querySelectorAll("[data-close]").forEach((el) => (el.onclick = async () => (await ctx.send("체결", () => ctx.write.bind(el.dataset.close))) && ctx.refresh()));
    document.querySelectorAll("[data-bind]").forEach((el) => (el.onclick = async () => (await ctx.send("보험료 돌려받기", () => ctx.write.bind(el.dataset.bind))) && ctx.refresh()));
    document.querySelectorAll("[data-void]").forEach((el) => (el.onclick = async () => (await ctx.send("보험료 돌려받기", () => ctx.write.voidPolicy(el.dataset.void))) && ctx.refresh()));
  };

  let importing = "";
  function showImport() {
    $("addBtn").textContent = importing || "예약 불러오기";
    $("addBtn").disabled = Boolean(importing);
    if ($("mainBtn").dataset.mode === "withdraw") return;
    $("mainBtn").textContent = importing || "내 예약 불러오기";
    $("mainBtn").disabled = Boolean(importing);
  }

  async function importBookings() {
    if (importing) return;
    importing = "불러오는 중…";
    showImport();
    try {
      await ctx.importBookings((done, total) => {
        importing = `불러오는 중 (${done}/${total})`;
        showImport();
      });
      loaded = true;
      toast("내 예약을 불러왔어요");
    } catch (e) {
      toast(reason(e), true);
    } finally {
      importing = "";
      showImport();
      ctx.refresh();
    }
  }
  $("addBtn").onclick = importBookings;
  $("walletMode").addEventListener("change", () => {
    loaded = false;
    ctx.refresh();
  });
  $("mainBtn").onclick = async () => {
    if ($("mainBtn").dataset.mode !== "withdraw") return importBookings();
    (await ctx.send("출금", () => ctx.write.withdraw())) && ctx.refresh();
  };
  await ctx.refresh();
  setInterval(() => !document.hidden && ctx.refresh().catch(() => {}), 10000);
})().catch((e) => toast(e.message || String(e), true));
</script>
</body>
</html>
