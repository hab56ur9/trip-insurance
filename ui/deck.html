    h(Diagram.Arrow, { from: "investor-ui", to: "engine", step: 3, label: "입찰", packet: "send" }),
    h(Diagram.Arrow, { from: "oracle", to: "engine", step: 4, label: "관측값", packet: "info" }),

        kicker: "블록체인기술과 응용 · 기말 프로젝트 · 2조",

        meta: "판단은 계약 전에, 지급은 코드가",
      }),
      h(AgendaSlide, { title: "목차", items: ["문제", "해결 방안", "서비스 흐름", "구성과 구현 선택", "시연"], current: 0 }),
      h(SplitSlide, {
        title: "문제",
        takeaway: "기존 여행자 보험은 필요 없는 보장까지 사고, 지급은 사고 뒤에 사람이 정한다.",
        ratio: "3:2",

        ] }),
        right: h("p", null, "예약한 일정이 틀어졌을 때, 낸 돈을 조건만 맞으면 바로 돌려받을 수 있어야 한다."),
        notes: "기존 보험의 세 가지 불편을 짚는다.",
      }),
      h(Slide, { notes: "세 원칙이 서비스의 핵심이다." },
        h(SlideHeader, { title: "해결 방안" }),

        h(Steps, { items: [

          { title: "시장 가격", body: "보장금액은 투자자들의 입찰 경쟁이 정한다." },
          { title: "코드 지급", body: "오라클 관측값이 조건에 맞으면 사람의 승인 없이 지급한다." },

        ] }),
      ),
      diagramSlide("서비스 흐름", "구매자와 투자자는 블록체인과만 주고받고, 일정 결과는 오라클이 전한다.", overview, ["① 구매자가 보험료를 맡기고 가입한다", "③ 투자자가 입찰금을 예치한다", "⑤ 마감 뒤 보장금액과 낙찰 지분이 확정된다", "⑦ 오라클이 관측값에 서명한다", "⑧ 결과대로 보장금 · 보험료 몫 · 수수료를 나눈다"], "번호 순서대로 가입 → 입찰 → 체결 → 판정 → 정산을 설명한다."),
      diagramSlide("가입", "구매자는 비용 NFT로 예약을 증명하고 보험료 · 보장 조건 · 최소 보장금액을 정한다.", joinFlow, ["보험료: 무사하면 투자자의 수익", "비용 NFT: 예약과 결제 금액 증명", "보장 조건: 오라클 관측값과 기준", "최소 보장금액: 경매 시작가", "NFT를 가진 사람만 가입한다"], "비용 NFT를 가진 사람만 가입할 수 있다."),
      diagramSlide("경매", "지분당 보장금액이 높은 입찰부터 지분 100개를 채우고, 각자 부른 금액으로 보장한다.", auctionFlow, ["지분 100개, 시작가는 최소 보장금액의 1/100", "지분 수 × 지분당 보장금액만큼 예치한다", "높은 금액부터 배정하고 각자 부른 금액으로 보장한다", "배정받지 못한 예치금은 환불한다", "다 안 팔리면 팔린 만큼만 계약한다"], "예시: A 60개, B 40개 낙찰, C는 탈락해 예치금을 돌려받는다."),
      diagramSlide("판정", "가입 때 정한 기준과 오라클 관측값을 비교해 지급 · 만료를 정하고, 관측값이 없으면 무효다.", judgeFlow, ["조건에 지정된 오라클의 서명만 인정한다", "충족이면 지급, 미충족이면 만료", "기간 안에 관측값이 없으면 무효", "사람의 승인 · 분쟁 절차가 없다"], "판정에는 사람의 승인이나 분쟁 절차가 없다."),
      diagramSlide("정산", "정산된 ETH는 주소별 잔액에 쌓이고, 각자 출금한다. 체결 보험료의 2%는 플랫폼 수수료다.", settleFlow, ["지급: 구매자가 보장금액 전액", "만료: 투자자가 예치금 + 보험료 몫", "무효 · 유찰: 양쪽 전액 환불", "체결 보험료의 2%는 플랫폼 수수료", "받을 ETH는 각자 출금한다"], "지급이면 구매자가 보장금액 전액, 만료면 투자자가 예치금과 보험료 몫을 받는다."),
      diagramSlide("구성", "컨트랙트 하나가 자산과 판정을 맡고, Mock 서버는 비용 NFT와 관측값만 공급한다.", architecture, ["보험 컨트랙트: 자산 보관과 규칙 실행", "비용 NFT: 예약 증명", "발급사 · 오라클 서버: Mock, 데이터만 공급", "실제 서비스로 바꿔도 컨트랙트는 그대로"], "실제 발급사와 오라클 대신 Mock 서버를 쓴다. 컨트랙트는 실제 서비스로 바꿔도 그대로다."),
