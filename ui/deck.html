    ),
    h(Diagram.Group, { id: "chain", label: "블록체인 네트워크" },

    h(Diagram.Arrow, { from: "bind", to: "i-won", step: 5, label: "낙찰 · 환불", packet: "check" }),
    h(Diagram.Arrow, { from: "bind", to: "settle", step: 6 }),
    h(Diagram.Arrow, { from: "oracle-node", to: "settle", step: 7, label: "관측값", packet: "info" }),
    h(Diagram.Arrow, { from: "settle", to: "b-claim", step: 8, label: "보장금", packet: "arrow-down" }),
    h(Diagram.Arrow, { from: "settle", to: "i-claim", step: 8, label: "보험료 몫", packet: "arrow-down" }),
    h(Diagram.Arrow, { from: "settle", to: "fee", step: 8, label: "수수료", packet: "arrow-down" }),
  );

  const architecture = h(Diagram, { id: "tech-architecture", title: "구성", flow: "packets" },
    h(Diagram.Group, { id: "screens", label: "화면" },
      h(Diagram.Node, { id: "buyer-ui", label: "구매자 화면", caption: "가입 · 보장금 받기", icon: "phone", col: 0, row: 0 }),
      h(Diagram.Node, { id: "investor-ui", label: "투자자 화면", caption: "입찰 · 수익 받기", icon: "phone", col: 0, row: 1 }),
    ),
    h(Diagram.Group, { id: "contracts", label: "블록체인" },
      h(Diagram.Node, { id: "nft", label: "비용 NFT", caption: "예약 · 결제 금액 · 소유자", icon: "file", col: 1, row: 0 }),
      h(Diagram.Node, { id: "engine", label: "보험 컨트랙트", caption: "가입 · 경매 · 판정 · 정산", icon: "shield", col: 1, row: 1 }),
      h(Diagram.Node, { id: "event", label: "서명 검증", caption: "오라클 서명 확인", icon: "check", col: 1, row: 2 }),
    ),
    h(Diagram.Group, { id: "mocks", label: "로컬 Mock 서버" },
      h(Diagram.Node, { id: "issuer", label: "발급사 서버", caption: "비용 NFT 발급", icon: "server", col: 2, row: 0 }),
      h(Diagram.Node, { id: "oracle", label: "오라클 서버", caption: "관측값에 서명", icon: "cloud", col: 2, row: 1 }),
    ),
    h(Diagram.Arrow, { from: "issuer", to: "nft", step: 1, label: "발급", packet: "file" }),
    h(Diagram.Arrow, { from: "buyer-ui", to: "engine", step: 2, label: "가입", packet: "send" }),
    h(Diagram.Arrow, { from: "engine", to: "nft", step: 2, label: "소유 확인", motion: "still" }),
    h(Diagram.Arrow, { from: "investor-ui", to: "engine", step: 3, label: "입찰", packet: "send" }),
    h(Diagram.Arrow, { from: "oracle", to: "engine", step: 4, label: "관측값", packet: "info" }),
    h(Diagram.Arrow, { from: "engine", to: "event", step: 4, label: "서명 확인", motion: "still" }),
  );

  const SCREENS = location.pathname.endsWith("/deck.html") ? "./" : "./demo/";

  const EVENTS = [
    "event PolicyRequested(uint256 indexed policyId, address indexed insured, uint256 tokenId, uint256 premium, uint256 minCoverage)",
    "event BidPlaced(uint256 indexed policyId, address indexed bidder, uint256 bidId, uint16 units, uint256 unitCoverage)",
    "event PolicyBound(uint256 indexed policyId, uint16 soldUnits, uint256 coverage, uint256 usedPremium)",
    "event PolicyCancelled(uint256 indexed policyId)",
    "event Settled(uint256 indexed policyId, uint8 status, int256 value, uint256 fee)",
    "event Claimed(uint256 indexed policyId, address indexed holder, uint256 amount)",
  ];
  const DEFAULT_ADDRESS = "0xc4DA565aE85053AEc2EF667C28a2AD787CD79bD6";
  const LOG_STEP = 200;
  const LOG_BATCH = 5;
  const LOG_ROUNDS = 60;
  const STATUS_TONE = ["neutral", "main", "main", "neutral", "critical", "good", "warning"];

  const script = (src) => new Promise((resolve, reject) => {
    const el = document.createElement("script");
    el.src = src;
    el.onload = resolve;
    el.onerror = () => reject(new Error(`${src}를 불러오지 못했어요`));
    document.head.append(el);
  });
  let chain;
  const connect = () => (chain ||= script("https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js")
    .then(() => script(`${SCREENS}shared.js`))
    .then(() => setup()));

  async function latestPolicy(ctx, address) {
    for (let id = Number(await ctx.read.policyCount()); id > 0; id--) {
      const policy = await ctx.read.policyOf(id);
      if (policy.insured.toLowerCase() !== address.toLowerCase()) continue;
      const [status, bids] = await Promise.all([ctx.read.statusOf(id), ctx.read.bidsOf(id)]);
      return { id, policy, bids, status: Number(status) };
    }
    return null;
  }

  async function retry(task, attempts = 3) {
    for (let i = 1; ; i++) {
      try { return await task(); }
      catch (err) { if (i >= attempts) throw err; await new Promise((r) => setTimeout(r, 1000 * i)); }
    }
  }

  async function policyLogs(ctx, id) {
    const iface = new ethers.Interface(EVENTS);
    const requested = iface.getEvent("PolicyRequested").topicHash;
    const topics = [null, ethers.zeroPadValue(ethers.toBeHex(id), 32)];
    const logs = [];
    let to = await ctx.provider.getBlockNumber();
    for (let round = 0; to >= 0 && round < LOG_ROUNDS; round++, to -= LOG_BATCH * LOG_STEP) {
      const ends = Array.from({ length: LOG_BATCH }, (_, i) => to - i * LOG_STEP).filter((end) => end >= 0).reverse();
      const found = (await Promise.all(ends.map((end) => retry(() => ctx.provider.getLogs({ address: ctx.config.insurance, topics, fromBlock: Math.max(0, end - LOG_STEP + 1), toBlock: end }))))).flat();
      logs.unshift(...found);
      if (found.some((log) => log.topics[0] === requested)) break;
    }
    return logs.map((log) => ({ log, event: iface.parseLog(log) })).filter((entry) => entry.event);
  }

  async function blocksOf(ctx, logs) {
    const numbers = [...new Set(logs.map(({ log }) => log.blockNumber))];
    const blocks = await Promise.all(numbers.map((n) => ctx.provider.getBlock(n)));
    return blocks.map((block) => ({ block, entries: logs.filter(({ log }) => log.blockNumber === block.number) }));
  }

  function describe({ event }) {
    const a = event.args;
    switch (event.name) {
      case "PolicyRequested": return { label: "가입", who: a.insured, text: `보험료 ${krw(a.premium)} · 최소 보장 ${krw(a.minCoverage)}` };
      case "BidPlaced": return { label: "입찰", who: a.bidder, text: `${a.units}지분 × ${krw(a.unitCoverage)}` };
      case "PolicyBound": return { label: "체결", text: `${a.soldUnits}지분 · 보장 ${krw(a.coverage)}` };
      case "PolicyCancelled": return { label: "유찰", text: "입찰이 없어 환불" };
      case "Settled": return { label: `판정 · ${STATUS[Number(a.status)]}`, text: `관측값 ${a.value} · 수수료 ${krw(a.fee)}` };
      case "Claimed": return { label: "청구", who: a.holder, text: krw(a.amount) };
    }
  }

  function outcome(found, item, logs) {
    const settled = logs.find(({ event }) => event.name === "Settled")?.event.args;
    const observed = settled && item ? `관측값 ${settled.value}${item.unit}, 기준 ${item.threshold}${item.unit}` : "";
    switch (found.status) {
      case 1: return "투자자 입찰을 모으고 있어요.";
      case 2: return "체결됐고, 판정을 기다리고 있어요.";
      case 3: return "입찰이 없어서 가입자가 보험료를 돌려받았어요.";
      case 4: return `${observed} 이상이라서 가입자가 보장금 ${krw(found.policy.coverage)}을 받았어요.`;
      case 5: return `${observed} 미만이라서 낙찰받은 투자자가 보험료를 나눠 받았어요.`;
      case 6: return "판정 기간에 서명이 오지 않아서 모두 돌려받았어요.";
    }
    return "";
  }

  async function participantsOf(ctx) {
    const url = ctx.config.participants || (await api(`${SCREENS}networks/base-sepolia.json`, "")).config.participants;
    return url ? api(url, "") : [];
  }

  async function namer(ctx, me) {
    const list = await participantsOf(ctx).catch(() => []);
    const names = new Map(list.map((p) => [p.address.toLowerCase(), p.name]));
    return (address) => {
      if (address.toLowerCase() === me) return "가입자";
      const name = names.get(address.toLowerCase());
      return name ? `${name} (${short(address)})` : short(address);
    };
  }

  function received(logs, holder) {
    return logs.filter(({ event }) => event.name === "Claimed" && event.args.holder === holder).reduce((sum, { event }) => sum + event.args.amount, 0n);
  }

  function Result({ found, item, logs, nameOf }) {
    const bound = found.policy.soldUnits > 0;
    return h("div", { style: css.result },
      h("div", { style: css.panel },
        h("strong", null, "낙찰"),
        found.bids.length === 0
          ? h("span", { style: css.muted }, "입찰이 없었어요")
          : h("table", { style: css.table },
              h("thead", null, h("tr", null, ["투자자", "입찰", "낙찰", "받은 금액"].map((th) => h("th", { key: th, style: css.cell }, th)))),
              h("tbody", null, found.bids.map((bid, i) => {
                const amount = received(logs, bid.bidder);
                return h("tr", { key: i },
                  h("td", { style: css.cell }, nameOf(bid.bidder)),
                  h("td", { style: css.cell }, `${bid.units}지분 × ${krw(bid.unitCoverage)}`),
                  h("td", { style: css.cell }, bound ? (bid.filled > 0 ? h(Badge, { tone: "good" }, `${bid.filled}지분`) : h(Badge, { tone: "neutral" }, "탈락")) : "배정 전"),
                  h("td", { style: css.cell }, amount > 0n ? krw(amount) : "—"));
              })))),
      h("div", { style: css.panel },
        h("strong", null, "결과"),
        h("div", null, h(Badge, { tone: STATUS_TONE[found.status] }, STATUS[found.status])),
        h("span", null, outcome(found, item, logs))));
  }

  const clock = (ts) => new Date(ts * 1000).toLocaleTimeString("ko-KR", { hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const short = (hex) => `${hex.slice(0, 6)}…${hex.slice(-4)}`;
  const stop = (e) => e.stopPropagation();
  const errorText = (err) => err.shortMessage || err.message || String(err);
  const css = {
    form: { display: "flex", gap: "var(--space-2)", alignItems: "center", maxWidth: "44rem" },
    summary: { display: "flex", gap: "var(--space-3)", alignItems: "center", flexWrap: "wrap", margin: "var(--space-4) 0 var(--space-3)", color: "var(--color-fg-secondary)" },
    chain: { display: "flex", alignItems: "stretch", gap: "var(--space-2)", overflowX: "auto", paddingBottom: "var(--space-2)" },
    link: { alignSelf: "center", color: "var(--color-fg-muted)" },
    block: { flex: "0 0 13rem", display: "flex", flexDirection: "column", gap: "var(--space-2)", padding: "var(--space-3)", border: "var(--border-width-default) solid var(--color-border-default)", borderRadius: "var(--radius-card)", background: "var(--color-bg-surface)" },
    head: { display: "flex", justifyContent: "space-between", gap: "var(--space-2)", whiteSpace: "nowrap", fontFamily: "var(--font-family-mono)", fontSize: "var(--font-size-caption)", color: "var(--color-fg-muted)" },
    entry: { display: "flex", flexDirection: "column", gap: "var(--space-1)", paddingTop: "var(--space-2)", borderTop: "var(--border-width-default) solid var(--color-border-default)", fontSize: "var(--font-size-label)" },
    mono: { fontFamily: "var(--font-family-mono)", fontSize: "var(--font-size-caption)", color: "var(--color-fg-muted)" },
    empty: { marginTop: "var(--space-4)", color: "var(--color-fg-muted)" },
    result: { display: "grid", gridTemplateColumns: "3fr 2fr", gap: "var(--space-4)", marginTop: "var(--space-4)" },
    panel: { display: "flex", flexDirection: "column", gap: "var(--space-2)", padding: "var(--space-4)", border: "var(--border-width-default) solid var(--color-border-default)", borderRadius: "var(--radius-card)" },
    table: { width: "100%", borderCollapse: "collapse", fontSize: "var(--font-size-label)" },
    cell: { textAlign: "left", padding: "var(--space-1) var(--space-2) var(--space-1) 0" },
    muted: { color: "var(--color-fg-muted)" },
  };

  function Block({ block, entries, explorer, nameOf }) {
    const tx = entries[0].log.transactionHash;
    return h("div", { style: css.block },
      h("div", { style: css.head }, h("span", null, `#${block.number.toLocaleString("ko-KR")}`), h("span", null, clock(block.timestamp))),
      explorer
        ? h("a", { style: css.mono, href: `${explorer}/tx/${tx}`, target: "_blank", rel: "noopener" }, `tx ${short(tx)}`)
        : h("span", { style: css.mono }, `tx ${short(tx)}`),
      entries.map((entry) => {
        const { label, who, text } = describe(entry);
        return h("div", { key: entry.log.index, style: css.entry },
          h("strong", null, label),
          who && h("span", { style: css.muted }, nameOf(who)),
          h("span", null, text));
      }));
  }

  function PolicyHistory() {
    const [address, setAddress] = useState(new URLSearchParams(location.search).get("address") || DEFAULT_ADDRESS);
    const [state, setState] = useState({ phase: "idle" });
    const search = async (e) => {
      e.preventDefault();
      if (!/^0x[0-9a-fA-F]{40}$/.test(address.trim())) return setState({ phase: "error", message: "0x로 시작하는 지갑 주소 40자리를 넣어 주세요" });
      setState({ phase: "loading" });
      try {
        const ctx = await connect();
        const found = await latestPolicy(ctx, address.trim());
        if (!found) return setState({ phase: "error", message: "이 주소로 가입한 보험이 없어요" });
        const [logs, nameOf] = await Promise.all([policyLogs(ctx, found.id), namer(ctx, address.trim().toLowerCase())]);
        const blocks = await blocksOf(ctx, logs);
        const explorer = ctx.config.local ? "" : "https://sepolia.basescan.org";
        setState({ phase: "done", found, logs, blocks, explorer, nameOf, item: ctx.caseOf(found.policy.subject) });
      } catch (err) {
        setState({ phase: "error", message: errorText(err) });
      }
    };
    const { found, logs, blocks, explorer, item, nameOf } = state;
    return h("div", { onKeyDown: stop, onPointerDown: stop },
      h("form", { style: css.form, onSubmit: search },
        h("div", { style: { flex: 1 } }, h(TextField, { label: "가입자 지갑 주소", hideLabel: true, value: address, onChange: setAddress, placeholder: DEFAULT_ADDRESS, icon: "search" })),
        h(Button, { variant: "primary", type: "submit", disabled: state.phase === "loading" }, state.phase === "loading" ? "조회 중…" : "조회")),
      state.phase === "error" && h("p", { style: css.empty }, state.message),
      state.phase === "done" && h("div", null,
        h("div", { style: css.summary },
          h("strong", null, `보험 #${found.id} · ${item?.title ?? "보험"}`),
          h(Badge, { tone: STATUS_TONE[found.status] }, STATUS[found.status]),
          h("span", null, `보험료 ${krw(found.policy.premium)}`),
          found.policy.coverage > 0n && h("span", null, `보장 ${krw(found.policy.coverage)}`)),
        h("div", { style: css.chain },
          blocks.flatMap(({ block, entries }, i) => [
            i > 0 && h("span", { key: `link-${block.number}`, style: css.link }, "→"),
            h(Block, { key: block.number, block, entries, explorer, nameOf }),
          ])),
        h(Result, { found, item, logs, nameOf })));
  }

  const PHONE = { width: 390, height: 740, scale: 0.9 };
  const BIG_PHONE = { width: 375, height: 667, scale: 1.35 };
  const phoneBox = (size) => ({ flex: "none", width: size.width * size.scale, height: size.height * size.scale, overflow: "hidden", border: "var(--border-width-default) solid var(--color-border-default)", borderRadius: "var(--radius-card)", background: "#fff" });
  const phoneFrame = (size) => ({ width: size.width, height: size.height, border: 0, transform: `scale(${size.scale})`, transformOrigin: "0 0" });
  const flowCss = {
    sides: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: "var(--space-6)", marginTop: "var(--space-3)" },
    side: { display: "flex", gap: "var(--space-4)", alignItems: "flex-start" },
    phone: phoneBox(PHONE),
    frame: phoneFrame(PHONE),
    steps: { display: "flex", flexDirection: "column", gap: "var(--space-3)", margin: 0, paddingLeft: "var(--space-5)" },
    body: { color: "var(--color-fg-muted)", fontSize: "var(--font-size-label)" },
    screen: { display: "flex", flexDirection: "column", alignItems: "flex-end", gap: "var(--space-2)" },
  };

  const presenter = { key: "", listeners: new Set() };
  window.tripPresenterKey = "";
  const setPresenter = (key) => {
    if (presenter.key === key) return;
    presenter.key = window.tripPresenterKey = key;
    presenter.listeners.forEach((listen) => listen(key));
  };
  function usePresenter() {
    const [key, setKey] = useState(presenter.key);
    useEffect(() => {
      presenter.listeners.add(setKey);
      return () => presenter.listeners.delete(setKey);
    }, []);
    return key;
  }

  const VISIBLE = 5;
  const masked = (key) => key.slice(0, VISIBLE) + "•".repeat(Math.max(0, key.length - VISIBLE));
  function unmask(key, next) {
    const shown = masked(key);
    let start = 0;
    while (start < shown.length && start < next.length && shown[start] === next[start]) start++;
    let end = 0;
    while (end < shown.length - start && end < next.length - start && shown[shown.length - 1 - end] === next[next.length - 1 - end]) end++;

      const check = () => setActive(page.classList.contains("is-current"));
      check();
      const observer = new MutationObserver(check);
      observer.observe(page, { attributes: true, attributeFilter: ["class"] });
      return () => observer.disconnect();
    }, []);
    return [ref, active];
  }

  function useBoard(load) {
    const [ref, active] = useActive();
    const [state, setState] = useState({ phase: "idle" });
    const [message, setMessage] = useState("");
    const refresh = async () => {
      setState((s) => ({ ...s, phase: s.data ? "done" : "loading" }));
      try { setState({ phase: "done", data: await load() }); }
      catch (err) { setState({ phase: "error", message: errorText(err) }); }
    };
    useEffect(() => { if (active && state.phase === "idle") refresh(); }, [active]);
    return { ref, state, message, setMessage, refresh };

  function FundBoard() {
    const board = useBoard(async () => {

    const amountWei = (() => { try { return ctx ? krwToWei(amount) : 0n; } catch { return 0n; } })();
    const waiting = rows.filter((r) => r.balance < amountWei);
    const send = async () => {
      setSending(true);
      try {
        let nonce = await ctx.provider.getTransactionCount(wallet.address, "pending");
        const sent = [];
        for (const r of waiting) sent.push(await wallet.sendTransaction({ to: r.address, value: amountWei - r.balance, nonce: nonce++ }));
        board.setMessage(`${sent.length}건 보냈어요. 블록을 기다리는 중…`);
        await Promise.all(sent.map((tx) => tx.wait()));
        board.setMessage(`${sent.length}명에게 보냈어요`);

  const ORACLE_EVENTS = [
    { key: "surf", title: "강릉 풍속 14m/s 이상" },

  const DECK_ABI = [
    "function observationHash(uint256 policyId, int256 value) view returns (bytes32)",
    "function settle(uint256 policyId, int256 value, bytes signature)",
  ];
  const BLOCK_TIME = 12;

  function observed(policy, happened) {
    const threshold = BigInt(policy.condition.threshold);
    if (happened) return threshold;
    return Number(policy.condition.comparison) === 0 ? threshold - 1n : threshold + 1n;
  }

  function OracleBoard() {
    const board = useBoard(async () => {
      const ctx = await connect();
      const [now, all] = await Promise.all([ctx.now(), ctx.policies()]);
      return { ctx, now, all };
    });
    const [key, setKey] = useState("");
    const [queue, setQueue] = useState({});
    const busy = useRef(false);
    const { ctx, now, all = [] } = board.state.data || {};
    const shared = usePresenter();
    const wallet = useMemo(() => {
      if (!ctx) return null;
      if (!key.trim()) {
        const fallback = shared ? new ethers.Wallet(shared, ctx.provider) : null;
        return fallback && fallback.address === ctx.config.oracle ? fallback : null;
      }
      try { return new ethers.Wallet(key.trim(), ctx.provider); } catch { return null; }
    }, [ctx, key, shared]);
    const signer = wallet && wallet.address === ctx.config.oracle ? wallet : null;
    const drop = (id) => setQueue((q) => { const next = { ...q }; delete next[id]; return next; });

    const settleOpen = async () => {
      if (busy.current) return;
      busy.current = true;
      try {
        const insurance = new ethers.Contract(ctx.config.insurance, DECK_ABI, signer);
        const time = await ctx.now();
        for (const [id, { value }] of Object.entries(queue)) {
          const [policy, status] = await Promise.all([ctx.read.policyOf(id), ctx.read.statusOf(id)]);
          if (Number(status) !== 1 && Number(status) !== 2) { drop(id); continue; }
          if (Number(status) !== 2 || time + BLOCK_TIME >= Number(policy.judgingEnd)) continue;
          const signature = await signer.signMessage(ethers.getBytes(await insurance.observationHash(id, value)));
          await (await insurance.settle(id, value, signature)).wait();
          drop(id);
          board.setMessage(`#${id} 판정에 서명해 보냈어요`);
        }
      } catch (err) {
        board.setMessage(errorText(err));
      } finally {
        busy.current = false;
      }
      await board.refresh();
    };
    useEffect(() => {
      if (!signer || Object.keys(queue).length === 0) return;
      settleOpen();
      const timer = setInterval(settleOpen, 5000);
      return () => clearInterval(timer);
    }, [signer, queue]);

    const send = (event, targets, happened) => {
      const mark = happened ? "O" : "X";
      setQueue((q) => ({ ...q, ...Object.fromEntries(targets.map((p) => [p.id, { value: observed(p.policy, happened), mark }])) }));
      board.setMessage(`${event.title}: ${mark}를 ${targets.length}건에 걸었어요. 판정 기간이 열리면 서명해 보내요`);
    };
    const hint = () => {
      if (!key) return signer ? `1번 슬라이드의 시연자 지갑으로 서명해요 · 오라클 ${short(signer.address)}` : `오라클 ${short(ctx.config.oracle)}의 키를 넣어 주세요. 키는 저장하지 않아요.`;
      if (!wallet) return "키 형식이 아니에요";
      return signer ? `오라클 ${short(signer.address)} · 서명 준비됨` : `오라클 주소가 아니에요 (${short(wallet.address)})`;
    };
    const card = (event) => {
      const item = ctx.cases.find((c) => c.key === event.key);
      if (!item) return null;
      const mine = all.filter((p) => p.policy.subject === item.subjectId);
      const targets = mine.filter((p) => p.status === 1 || p.status === 2);
      const done = mine.filter((p) => p.status === 4 || p.status === 5);
      const queued = [...new Set(targets.filter((p) => queue[p.id]).map((p) => queue[p.id].mark))];
      const waiting = targets.some((p) => p.status === 1);
      return h("div", { key: event.key, style: boardCss.card },
        h("div", { style: boardCss.row }, h("strong", null, event.title), queued.length > 0 && h(Badge, { tone: "main" }, `${queued.join("/")} 판정 대기`)),
        h("span", { style: css.muted }, `${item.title} · ${conditionText(item)}`),
        h("div", { style: boardCss.kv }, h("span", { style: css.muted }, "판정할 보험"), h("span", null, targets.length ? targets.map((p) => `#${p.id} ${STATUS[p.status]}`).join(", ") : "없음")),
        waiting && h("div", { style: boardCss.kv }, h("span", { style: css.muted }, "판정 시작"), h("span", null, "체결되면 바로")),
        done.length > 0 && h("div", { style: boardCss.kv }, h("span", { style: css.muted }, "판정 끝"), h("span", null, done.map((p) => `#${p.id} ${STATUS[p.status]}`).join(", "))),
        h("div", { style: boardCss.vote },
          h(Button, { variant: "primary", disabled: !signer || !targets.length, onClick: () => send(event, targets, true) }, h("span", { style: boardCss.mark }, "O")),
          h(Button, { variant: "secondary", disabled: !signer || !targets.length, onClick: () => send(event, targets, false) }, h("span", { style: boardCss.mark }, "X"))));
    };
    return h("div", { ref: board.ref, style: { ...boardCss.root, marginTop: 0 }, onKeyDown: stop, onPointerDown: stop },
      h(BoardBar, { board }, h("strong", null, "이벤트 발생기"), h("span", null, now ? `체인 시각 ${when(now)}` : "")),
      board.state.phase === "loading" && h("p", { style: css.empty }, "불러오는 중…"),
      ctx && h(KeyField, { label: "오라클 서명 키", value: key, onChange: setKey, hint: hint() }),
      ctx && h("div", { style: boardCss.cards }, ORACLE_EVENTS.map(card)));
  }



  const FEE_BPS = 200n;

  function feeOf(p) {
    if (p.stored !== 4 && p.stored !== 5) return null;
    const fee = p.policy.usedPremium * FEE_BPS / 10000n;
