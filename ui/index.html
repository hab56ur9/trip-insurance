<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>보험 투자</title>
<link rel="stylesheet" href="app.css?v=20261121x">
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.4/dist/ethers.umd.min.js"></script>
<script src="shared.js?v=20261121x"></script>
</head>
<body>
<main>
  <div class="top">
    <div class="row" style="gap: 4px;"><button class="back" id="back" hidden aria-label="뒤로">‹</button><h1 id="heading">보험 투자</h1></div>
    <span class="pill"><span class="dot" id="dot"></span>
      <select id="walletMode" aria-label="지갑">
        <option value="5">투자자 alice #5</option>
        <option value="6">투자자 bob #6</option>
        <option value="7">투자자 carol #7</option>
        <option value="temp">내 임시 지갑</option>
        <option value="presenter">시연자</option>
      </select>
    </span>
  </div>
  <nav class="nav" id="nav"><a href="buy/">보험</a><a class="on" href="./">투자</a></nav>

  <section data-view="home">
    <div class="hero" id="hero">
      <div class="label">내 지갑</div>
      <div class="big" id="balance">—</div>
      <div class="sub" id="creditLine" hidden></div>
    </div>
    <div class="card" id="wait" hidden><div class="title">시연자가 ETH를 보내 주길 기다리는 중이에요</div><div class="meta">받으면 입찰할 수 있어요. 테스트넷 ETH라 실제 돈은 아니에요.</div></div>
    <div class="card" id="gas" hidden><div class="row"><span><span class="title">가스비가 부족해요</span><div class="meta">테스트 ETH를 한 번 받을 수 있어요.</div></span><button class="btn sm" id="gasBtn">받기</button></div></div>
    <div class="section">
      <h2>입찰할 수 있는 보험</h2>
      <div id="open"><div class="empty">불러오는 중…</div></div>
    </div>
    <div class="section">
      <h2>내 투자</h2>
      <div id="mine"><div class="empty">불러오는 중…</div></div>
    </div>
    <div class="cta" id="homeCta" hidden><div class="inner"><button class="btn" id="withdrawBtn">출금하기</button></div></div>
  </section>

  <section data-view="join" hidden>
    <div class="hero">
      <div class="label">시연에 참여하려면</div>
      <div class="big">이름을 알려 주세요</div>
      <div class="sub">이 폰에 지갑이 하나 만들어지고, 시연자가 그 지갑으로 입찰에 쓸 ETH를 보내 줘요.</div>
    </div>
    <div class="field">
      <label for="joinName">이름</label>
      <input id="joinName" maxlength="20" autocomplete="name" placeholder="홍길동">
    </div>
    <div class="cta"><div class="inner"><button class="btn" id="doJoin">참여하기</button></div></div>
  </section>

  <section data-view="bid" hidden>
    <div class="hero">
      <div class="label" id="bidTitle"></div>
      <div class="row" style="align-items: flex-end;"><div class="big up" id="rate"></div><div id="riskBox"></div></div>
      <div class="sub" id="summary" style="font-size: 15px; color: var(--text-2);"></div>
      <div class="sub" id="bidNote" style="margin-top: 6px;"></div>
    </div>
    <div class="order">
      <div class="order-row">
        <span class="k">지분당 보장금액<small id="priceEth"></small></span>
        <span class="stepper"><button type="button" data-step="price:-1" aria-label="1원 내리기">−</button><input id="price" inputmode="numeric" aria-label="지분당 보장금액"><span class="unit">원</span><button type="button" data-step="price:1" aria-label="1원 올리기">+</button></span>
      </div>
      <div class="order-row">
        <span class="k">지분 수<small>최대 100개</small></span>
        <span class="stepper"><button type="button" data-step="units:-1" aria-label="1개 빼기">−</button><input id="units" inputmode="numeric" aria-label="지분 수"><span class="unit">개</span><button type="button" data-step="units:1" aria-label="1개 더하기">+</button></span>
      </div>
      <div class="quick"><button type="button" data-units-set="10">10개</button><button type="button" data-units-set="50">50개</button><button type="button" data-units-set="100">최대</button></div>
    </div>
    <div class="cta"><div class="inner"><button class="btn" id="doBid">입찰하기</button></div></div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
(async () => {
  const ctx = await setup();
  const show = createViews({ home: "보험 투자", bid: "입찰하기", join: "시연 참여" });
  const participants = ctx.config.participants;
  let bidding = null;
  let policies = [];

  const startOf = (p) => p.policy.minCoverage / 100n;
  const riskLevel = (pct) => (pct <= 2 ? ["low", "낮음"] : pct <= 4 ? ["mid", "보통"] : ["high", "높음"]);
  const riskChip = (item) => {
    if (!item) return "";
    const [level, word] = riskLevel(item.riskPct);
    return `<span class="chip risk-${level}">위험도 ${word} ${item.riskPct}%</span>`;
  };
  const riskBlock = (item) => {
    if (!item) return "";
    const [level, word] = riskLevel(item.riskPct);
    return `<div class="risk ${level}"><span class="k">위험도 ${word}</span><span class="v">${item.riskPct}%</span><small>틀어질 확률 (가정)</small></div>`;
  };
  const rateOf = (premium, unitCoverage) => (Number(premium) * 0.98 / (100 * Number(unitCoverage)) * 100).toFixed(2);
  const topOf = (p) => p.bids.reduce((a, b) => (b.unitCoverage > a ? b.unitCoverage : a), 0n);

  function openCard(p, now) {
    return `<div class="card tap" data-open="${p.id}">
      <div class="row"><span class="title">${esc(p.item?.title || `보험 #${p.id}`)}</span><span class="row" style="gap: 6px;">${riskChip(p.item)}<span class="chip info">${left(p.policy.biddingEnd, now)}</span></span></div>
      <div class="row"><span class="meta">보장금액 최소 ${krw(p.policy.minCoverage)} · 입찰 ${p.bids.length}건</span><span class="amount up">+${rateOf(p.policy.premium, startOf(p))}%</span></div>
    </div>`;
  }

  function summary(status, won, deposit) {
    if (status === 1) return "마감 뒤 배정돼요";
    if (status === 3) return "유찰돼 예치금을 돌려받아요";
    if (status === 4) return `낙찰 ${won}개 · 예치금 ${krw(deposit)}은 보장금으로 지급, 보험료 몫을 받아요`;
    if (status === 5) return `낙찰 ${won}개 · 예치금 ${krw(deposit)}과 보험료 몫을 받아요`;
    if (status === 6) return `낙찰 ${won}개 · 예치금 ${krw(deposit)}을 돌려받아요`;
    return `낙찰 ${won}개 · 예치금 ${krw(deposit)}으로 보장 중`;
  }

  function myCard(p) {
    const filled = p.stored >= 2 ? p.bids.map((b) => Number(b.filled)) : p.status === 1 ? p.bids.map(() => 0) : allocation(p.bids);
    const mine = p.bids.map((b, i) => ({ b, filled: filled[i] })).filter(({ b }) => b.bidder === ctx.address);
    const won = mine.reduce((a, m) => a + m.filled, 0);
    const deposit = mine.reduce((a, m) => a + BigInt(m.filled) * m.b.unitCoverage, 0n);
    const refundable = p.status !== 1 && mine.some(({ b, filled }) => !b.refunded && Number(b.units) > filled);
    const payable = [4, 5, 6].includes(p.status) && mine.some(({ b, filled }) => !b.claimed && filled > 0);
    const action = refundable || payable ? `<button class="btn sm" data-claim="${p.id}">청구하기</button>` : "";
    return `<div class="card"><div class="row"><span class="title">${esc(p.item?.title || `보험 #${p.id}`)}</span>${statusChip(p.status)}</div>
      <div class="row"><span class="meta">${summary(p.status, won, deposit)}</span>${action}</div></div>`;
  }

  const digits = (v) => Number(String(v).replace(/[^0-9]/g, "")) || 0;
  function updateDeposit() {
    $("priceEth").textContent = ethHint($("price").value);
    let total = 0n;
    try { total = krwToWei($("price").value) * BigInt(Math.max(0, digits($("units").value))); } catch {}
    const units = Math.min(100, Math.max(0, digits($("units").value)));
    const share = bidding ? (bidding.policy.premium * 98n * BigInt(units)) / 10000n : 0n;
    $("summary").innerHTML = `<b>${krw(total)}</b>을 맡기면 무사할 때 <b>+${krw(share)}</b> <small class="muted">(${eth(total)})</small>`;
    let price = 0n;
    try { price = krwToWei($("price").value); } catch {}
    $("rate").textContent = bidding && price > 0n ? `+${rateOf(bidding.policy.premium, price)}%` : "—";
  }
  $("units").oninput = updateDeposit;
  $("price").oninput = updateDeposit;
  document.querySelectorAll("[data-step]").forEach((el) => (el.onclick = () => {
    const [field, delta] = el.dataset.step.split(":");
    const next = Math.max(field === "units" ? 1 : 0, digits($(field).value) + Number(delta));
    $(field).value = field === "units" ? String(Math.min(100, next)) : won(next);
    updateDeposit();
  }));
  document.querySelectorAll("[data-units-set]").forEach((el) => (el.onclick = () => {
    $("units").value = el.dataset.unitsSet;
    updateDeposit();
  }));

  async function openBid(id) {
    const p = policies.find((x) => x.id === Number(id));
    const now = await ctx.now();
    bidding = p;
    const start = startOf(p);
    const top = topOf(p);
    $("bidTitle").textContent = p.item?.title || `보험 #${p.id}`;
    $("riskBox").innerHTML = riskBlock(p.item);
    $("bidNote").textContent = `${conditionText(p.item).replace("이면 지급", "이면 맡긴 금액은 구매자에게 가요")} · ${left(p.policy.biddingEnd, now)}`;
    $("units").value = "10";
    $("price").value = won(weiToKrwCeil(top > start ? top : start));
    updateDeposit();
    show("bid");
  }

  $("doBid").onclick = async () => {
    let price;
    try { price = krwToWei($("price").value); } catch { return toast("지분당 보장금액을 확인해 주세요", true); }
    const units = digits($("units").value);
    $("doBid").disabled = true;
    const ok = await ctx.send("입찰", () => ctx.write.placeBid(bidding.id, units, price, { value: price * BigInt(units) }));
    $("doBid").disabled = false;
    if (ok) { history.back(); ctx.refresh(); }
  };

  ctx.refresh = async () => {
    const now = await ctx.now();
    const [credits, balance, all] = await Promise.all([ctx.read.credits(ctx.address), ctx.provider.getBalance(ctx.address), ctx.policies()]);
    policies = all;
    await ctx.gasBanner();
    $("wait").hidden = !participants || balance > 0n;
    $("balance").innerHTML = money(balance);
    $("creditLine").hidden = credits === 0n;
    $("creditLine").innerHTML = `출금할 수 있는 금액 <b>${krw(credits)}</b>`;
    $("homeCta").hidden = credits === 0n;

    const open = all.filter((p) => p.status === 1 && p.policy.insured !== ctx.address).reverse();
    $("open").innerHTML = open.length ? open.map((p) => openCard(p, now)).join("") : `<div class="empty">지금 입찰할 수 있는 보험이 없어요.</div>`;
    const mine = all.filter((p) => p.bids.some((b) => b.bidder === ctx.address)).reverse();
    $("mine").innerHTML = mine.length ? mine.map(myCard).join("") : `<div class="empty">아직 입찰한 보험이 없어요.</div>`;

    document.querySelectorAll("[data-open]").forEach((el) => (el.onclick = () => openBid(el.dataset.open)));
    document.querySelectorAll("[data-claim]").forEach((el) => (el.onclick = async () => (await ctx.send("청구", () => ctx.write.claim(el.dataset.claim))) && ctx.refresh()));
  };

  $("withdrawBtn").onclick = async () => (await ctx.send("출금", () => ctx.write.withdraw())) && ctx.refresh();

  $("doJoin").onclick = async () => {
    const name = $("joinName").value.trim();
    if (!name) return toast("이름을 입력해 주세요", true);
    $("doJoin").disabled = true;
    try {
      const result = await api(participants, "", { address: ctx.address, name });
      if (!result.ok) throw new Error(result.full ? "참여 인원이 가득 찼어요" : "참여하지 못했어요");
      toast(`${name}님, 참여했어요`);
      show("home", false);
    } catch (e) {
      toast(e.message, true);
    } finally {
      $("doJoin").disabled = false;
    }
  };
  if (participants) {
    const joined = (await api(participants, "")).some((p) => p.address.toLowerCase() === ctx.address.toLowerCase());
    if (!joined) {
      show("join", false);
      $("back").hidden = true;
    }
  }
  await ctx.refresh();
  setInterval(() => !document.hidden && ctx.refresh().catch(() => {}), 10000);
})().catch((e) => toast(e.message || String(e), true));
</script>
</body>
</html>
