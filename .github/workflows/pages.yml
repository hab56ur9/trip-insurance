name: pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Build site
        run: |
          mkdir -p _site/demo _site/docs
          cp -R ui/. _site/demo/
          rm -rf _site/demo/deck.html _site/demo/demo-qr.svg
          cp ui/deck.html _site/index.html
          cp ui/demo-qr.svg _site/
          cp docs/*.html docs/*.pdf _site/docs/
          cp -R docs/diagrams _site/docs/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
