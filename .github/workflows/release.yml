name: release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  deploy-contracts:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: base-sepolia
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: forge test
      - name: Deploy to Base Sepolia
        env:
          RPC: ${{ vars.BASE_SEPOLIA_RPC || 'https://sepolia.base.org' }}
          UNSAFE_DEMO_KEY: ${{ secrets.UNSAFE_DEMO_KEY }}
          PROFILE: demo
        run: npm run deploy:base-sepolia
      - name: Commit network settings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/networks/base-sepolia.json
          git commit -m "chore: deploy ${{ needs.release-please.outputs.tag }} to Base Sepolia"
          git push origin HEAD:master

  pages:
    needs: deploy-contracts
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: master
